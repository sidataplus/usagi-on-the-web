[workspace]
members = [
  "crates/usagi-common",
  "crates/usagi-contracts",
  "crates/usagi-jobs",
  "crates/usagi-catalog",
  "crates/usagi-search",
  "crates/usagi-embed",
  "crates/usagi-thirawat",
  "crates/usagi-artifacts",
  "crates/usagi-tachiom",
  "services/catalog-api",
  "services/search-api",
  "services/mapper-api",
  "services/api-worker",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
half = "2.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.25"
tempfile = "3.14"
thiserror = "2.0"
tokenizers = "0.22"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
usearch = "2.19"
uuid = { version = "1.11", features = ["v4", "serde"] }
