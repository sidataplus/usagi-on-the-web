service: usagi_rails

image: <%= ENV.fetch("KAMAL_IMAGE", "sidataplus/usagi-on-the-web/rails-web") %>

servers:
  web:
    - <%= ENV.fetch("KAMAL_WEB_HOST", "replace-with-web-droplet-ip") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "usagi.example.com") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("GHCR_USERNAME", "sidataplus") %>
  password:
    - GHCR_TOKEN

env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - USAGI_API_SHARED_SECRET
  clear:
    SOLID_QUEUE_IN_PUMA: true
    ENGINE_CLIENT_MODE: http
    CATALOG_API_URL: <%= ENV.fetch("CATALOG_API_URL", "http://catalog-api:8788") %>
    SEARCH_API_URL: <%= ENV.fetch("SEARCH_API_URL", "http://search-api:8789") %>
    MAPPER_API_URL: <%= ENV.fetch("MAPPER_API_URL", "http://mapper-api:8790") %>
    JOBS_API_URL: <%= ENV.fetch("JOBS_API_URL", ENV.fetch("MAPPER_API_URL", "http://mapper-api:8790")) %>
    APP_HOST: <%= ENV.fetch("APP_HOST", "usagi.example.com") %>
    APP_HOSTS: <%= ENV.fetch("APP_HOSTS", ENV.fetch("APP_HOST", "usagi.example.com")) %>
    FORCE_SSL: true

    # Set number of processes dedicated to Solid Queue (default: 1).
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for Solid Queue/Cache/Cable SQLite files and
# local Active Storage files. Back this up with the PostgreSQL database.
volumes:
  - "usagi_rails_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-4.0.5
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Omit accessories.db when DATABASE_URL points at RDS or another managed Postgres.
accessories:
  db:
    image: postgres:17-alpine
    host: <%= ENV.fetch("KAMAL_DB_HOST", ENV.fetch("KAMAL_WEB_HOST", "replace-with-db-droplet-ip")) %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: usagi_production
        POSTGRES_USER: usagi
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  catalog-api:
    image: ghcr.io/<%= ENV.fetch("GHCR_IMAGE_PREFIX", "sidataplus/usagi-on-the-web") %>/catalog-api:<%= ENV.fetch("USAGI_IMAGE_TAG", "latest") %>
    host: <%= ENV.fetch("KAMAL_ENGINE_HOST", ENV.fetch("KAMAL_WEB_HOST", "replace-with-engine-droplet-ip")) %>
    env:
      clear:
        USAGI_API_ENV: production
        USAGI_API_AUTH_MODE: signed
        CATALOG_DB_PATH: /data/catalog/catalog.sqlite
        JOBS_DB_PATH: /data/jobs/jobs.sqlite
        JOB_RESULTS_DIR: /data/jobs/results
        TANTIVY_INDEX_DIR: /data/search/tantivy/index
        SAPBERT_INDEX_DIR: /data/search/sapbert
        SAPBERT_MODEL_DIR: /data/models/sapbert
      secret:
        - USAGI_API_SHARED_SECRET
    directories:
      - data:/data

  search-api:
    image: ghcr.io/<%= ENV.fetch("GHCR_IMAGE_PREFIX", "sidataplus/usagi-on-the-web") %>/search-api:<%= ENV.fetch("USAGI_IMAGE_TAG", "latest") %>
    host: <%= ENV.fetch("KAMAL_ENGINE_HOST", ENV.fetch("KAMAL_WEB_HOST", "replace-with-engine-droplet-ip")) %>
    env:
      clear:
        USAGI_API_ENV: production
        USAGI_API_AUTH_MODE: signed
        CATALOG_DB_PATH: /data/catalog/catalog.sqlite
        JOBS_DB_PATH: /data/jobs/jobs.sqlite
        JOB_RESULTS_DIR: /data/jobs/results
        TANTIVY_INDEX_DIR: /data/search/tantivy/index
        SAPBERT_INDEX_DIR: /data/search/sapbert
        SAPBERT_MODEL_DIR: /data/models/sapbert
      secret:
        - USAGI_API_SHARED_SECRET
    directories:
      - data:/data

  mapper-api:
    image: ghcr.io/<%= ENV.fetch("GHCR_IMAGE_PREFIX", "sidataplus/usagi-on-the-web") %>/mapper-api:<%= ENV.fetch("USAGI_IMAGE_TAG", "latest") %>
    host: <%= ENV.fetch("KAMAL_ENGINE_HOST", ENV.fetch("KAMAL_WEB_HOST", "replace-with-engine-droplet-ip")) %>
    env:
      clear:
        USAGI_API_ENV: production
        USAGI_API_AUTH_MODE: signed
        JOBS_DB_PATH: /data/jobs/jobs.sqlite
        JOB_RESULTS_DIR: /data/jobs/results
        THIRAWAT_MODEL_DIR: /data/models/thirawat-sapbert
        THIRAWAT_ARTIFACT_DIR: /data/mapper/thirawat-drug
        TACHIOM_INDEX_DIR: /data/mapper/thirawat-drug/tachiom
        THIRAWAT_QUERY_EMBEDDINGS_PATH: /data/mapper/thirawat-drug/query_embeddings.json
      secret:
        - USAGI_API_SHARED_SECRET
    directories:
      - data:/data

  api-worker:
    image: ghcr.io/<%= ENV.fetch("GHCR_IMAGE_PREFIX", "sidataplus/usagi-on-the-web") %>/api-worker:<%= ENV.fetch("USAGI_IMAGE_TAG", "latest") %>
    host: <%= ENV.fetch("KAMAL_ENGINE_HOST", ENV.fetch("KAMAL_WEB_HOST", "replace-with-engine-droplet-ip")) %>
    env:
      clear:
        USAGI_API_ENV: production
        USAGI_API_AUTH_MODE: signed
        JOBS_DB_PATH: /data/jobs/jobs.sqlite
        JOB_RESULTS_DIR: /data/jobs/results
        CATALOG_DB_PATH: /data/catalog/catalog.sqlite
        WORKER_QUEUES: catalog,index,embed,map
        TANTIVY_INDEX_DIR: /data/search/tantivy/index
        SAPBERT_INDEX_DIR: /data/search/sapbert
        SAPBERT_MODEL_DIR: /data/models/sapbert
        SAPBERT_PRECOMPUTED_EMBEDDINGS_PATH: /data/search/sapbert-doc-embeddings.json
        THIRAWAT_MODEL_DIR: /data/models/thirawat-sapbert
        THIRAWAT_ARTIFACT_DIR: /data/mapper/thirawat-drug
        TACHIOM_INDEX_DIR: /data/mapper/thirawat-drug/tachiom
        THIRAWAT_QUERY_EMBEDDINGS_PATH: /data/mapper/thirawat-drug/query_embeddings.json
      secret:
        - USAGI_API_SHARED_SECRET
    directories:
      - data:/data
